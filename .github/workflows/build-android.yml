
name: Build Dayflow APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Check project configuration
        run: |
          test -f package.json || {
            echo "ERROR: package.json missing from repository root"
            exit 1
          }

          test -f capacitor.config.ts -o \
               -f capacitor.config.json -o \
               -f capacitor.config.js || {
            echo "ERROR: Capacitor config missing"
            exit 1
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install Capacitor Android
        run: |
          CORE=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          MAJOR="${CORE%%.*}"
          npm install --no-save --no-audit --no-fund "@capacitor/android@$MAJOR"

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Dayflow-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
