
name: Build Dayflow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: 
        
      - name: Extract Dayflow source ZIP
        run: |
          unzip -o "Dayflow-Android-Source.zip" -d .
          echo "Checking extracted files:"
          find . -path '*/src/main.tsx' -o -name package.json
          if [ ! -f src/main.tsx ]; then
            echo "Looking for nested source folder..."
            MAIN_FILE=$(find . -path '*/src/main.tsx' -not -path './node_modules/*' | head -n 1)
            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: src/main.tsx not found in ZIP"
              exit 1
            fi
            PROJECT_DIR="${MAIN_FILE%/src/main.tsx}"
            cp -a "$PROJECT_DIR"/. .
          fi
          test -f src/main.tsx

        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname 'Dayflow-Android-Source.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Dayflow source ZIP not found"
            find . -maxdepth 2 -type f
            exit 1
          fi
          mkdir -p /tmp/dayflow-source
          unzip -o "$ZIP_FILE" -d /tmp/dayflow-source
          SOURCE_DIR=$(find /tmp/dayflow-source -type f -path '*/src/main.tsx' -printf '%h\n' | sed 's#/src$##' | head -n 1)
          if [ -z "$SOURCE_DIR" ]; then
            echo "ERROR: ZIP does not contain src/main.tsx"
            find /tmp/dayflow-source -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          cp -a "$SOURCE_DIR"/. .
          test -f src/main.tsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
